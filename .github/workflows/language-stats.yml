name: Update language stats

on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/language_stats.py
      - .github/workflows/language-stats.yml

permissions:
  contents: write

concurrency:
  group: language-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate aggregate language card
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'PROFILE_STATS_TOKEN is required for private repository statistics.'
            exit 1
          fi
          python3 scripts/language_stats.py
      - name: Save updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update language stats'
            git push
          fi
