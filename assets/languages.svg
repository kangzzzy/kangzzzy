<text x="358" y="72" font-size="10">JavaScript</text>
<text class="muted" x="496" y="72" text-anchor="end" font-size="10">10.0%</text>
<circle cx="22" cy="91" r="2" fill="#315bff"/>
<text x="30" y="94" font-size="10">Java</text>
<text class="muted" x="168" y="94" text-anchor="end" font-size="10">2.4%</text>
