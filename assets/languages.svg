<text class="muted" x="332" y="94" text-anchor="end" font-size="10">1.9%</text>
<circle cx="350" cy="91" r="2" fill="#315bff"/>
<text x="358" y="94" font-size="10">Python</text>
<text class="muted" x="496" y="94" text-anchor="end" font-size="10">1.9%</text>
